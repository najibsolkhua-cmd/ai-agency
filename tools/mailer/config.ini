; Настройки рассылки. Сохраняйте файл в кодировке UTF-8 (Блокнот: «Сохранить как» → UTF-8).

[mail]
; yandex — для почты Яндекса и Яндекс 360, mailru — для Mail.ru и VK WorkSpace
provider = yandex
; Ваш адрес, с которого отправляем
email = ВАШ_АДРЕС@yandex.ru
; ПАРОЛЬ ПРИЛОЖЕНИЯ (не обычный пароль от почты!) — см. инструкцию, шаг 3
app_password = ВАШ_ПАРОЛЬ_ПРИЛОЖЕНИЯ
; Имя отправителя, которое увидит получатель
from_name = ВАШЕ_ИМЯ — ИИ-фото для маркетплейсов
; Обычно менять не нужно (заполняется само по provider)
smtp_host =
smtp_port =
security =
imap_host =
; Проверять входящие: кто ответил — тому не шлём напоминание
check_replies = yes

[letter]
; Подставляется в письмо вместо {Имя}, {Telegram}, {Телефон}
your_name = ВАШЕ_ИМЯ
telegram = @ваш_ник
phone =
; Файл с базой из расширения. Пусто — возьму самый свежий wb-leads-*.xlsx
; из этой папки или из папки «Загрузки».
leads_file =

[schedule]
; Сколько писем в день максимум после прогрева (программа не даст больше 100).
; Прогрев встроен: 1-я неделя — 10 в день, 2-я — 20, 3-я — 35, дальше — это число.
max_per_day = 50
; Пауза между письмами, секунд (случайная в этом диапазоне)
delay_min_sec = 60
delay_max_sec = 240
; Отправлять только в это время (часы)
work_hours = 9-19
; Через сколько дней отправить одно напоминание тем, кто не ответил
followup_after_days = 3
